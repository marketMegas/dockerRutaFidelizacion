name: fidelizacion-glp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER en .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Falta POSTGRES_DB en .env}"
    volumes:
      - datos_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - datos_redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file: .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Falta DATABASE_URL en .env}"
      REDIS_URL: "${REDIS_URL:?Falta REDIS_URL en .env}"
      CATALOGO_PATH: ${CATALOGO_PATH:-/app/data/catalogo.json}
      TZ_ESTACION: ${TZ_ESTACION:-America/Bogota}
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?Falta SECRET_KEY en .env}"
      ADMIN_USER: "${ADMIN_USER:?Falta ADMIN_USER en .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}"
      SYNC_API_KEY: "${SYNC_API_KEY:?Falta SYNC_API_KEY en .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Falta CORS_ORIGINS en .env}"
      SMS_PROVIDER: "${SMS_PROVIDER:?Falta SMS_PROVIDER en .env}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - datos_catalogo:/app/data
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - backend
      - app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  panel:
    build: ./panel
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5139:8080"
    networks:
      - app

  pwa:
    build: ./pwa
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5140:8080"
    networks:
      - app

  connector:
    build: ./connector-zencillo
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file: .env.connector
    environment:
      FID_API_URL: http://api:8000/fid-api
      COLA_ARCHIVO: ${COLA_ARCHIVO:-/app/datos/cola_offline.json}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - datos_conector:/app/datos
    networks:
      - app

volumes:
  datos_db:
  datos_redis:
  datos_catalogo:
  datos_conector:

networks:
  backend:
    internal: true
  app:
