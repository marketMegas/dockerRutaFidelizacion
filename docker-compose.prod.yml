name: fidelizacion-glp

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - datos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"

  panel:
    build: ./panel
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5139:80"

  pwa:
    build: ./pwa
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5140:80"

  connector:
    build: ./connector-zencillo
    restart: always
    env_file: .env
    environment:
      FID_API_URL: http://api:8000/fid-api
      ESTACION_ID: ${ESTACION_ID}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - datos_conector:/app/datos

volumes:
  datos_db:
  datos_redis:
  datos_conector:
