name: fidelizacion-glp

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER en .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Falta POSTGRES_DB en .env}"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - datos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Falta DATABASE_URL en .env}"
      REDIS_URL: "${REDIS_URL:?Falta REDIS_URL en .env}"
      CATALOGO_PATH: ${CATALOGO_PATH:-/app/data/catalogo.json}
      TZ_ESTACION: ${TZ_ESTACION:-America/Bogota}
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - datos_catalogo:/app/data
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  panel:
    build: ./panel
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5139:80"

  pwa:
    build: ./pwa
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5140:80"

  connector:
    build: ./connector-zencillo
    restart: always
    env_file: .env
    environment:
      FID_API_URL: http://api:8000/fid-api
      ESTACION_ID: "${ESTACION_ID:?Falta ESTACION_ID en .env}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - datos_conector:/app/datos

volumes:
  datos_db:
  datos_redis:
  datos_catalogo:
  datos_conector:
