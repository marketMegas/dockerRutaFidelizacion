# Ejemplo de contexto para OpenLiteSpeed (CyberPanel).
# Agregar los tres "external apps" (proxy) al vhost del subdominio
# fidelizacion.megas.com.co, y el .htaccess con las reglas [P].
#
# En CyberPanel: Websites > fidelizacion.megas.com.co > Manage > Rewrite Rules
# (pegar el contenido de htaccess-fidelizacion.txt) y los external apps en
# el archivo de vhost /usr/local/lsws/conf/vhosts/<vhost>/vhconf.conf

extprocessor fid_api {
  type                    proxy
  address                 127.0.0.1:8002
  maxConns                100
  pcKeepAliveTimeout      60
  respBuffer              0
}

extprocessor fid_panel {
  type                    proxy
  address                 127.0.0.1:5139
  maxConns                100
  pcKeepAliveTimeout      60
  respBuffer              0
}

extprocessor fid_pwa {
  type                    proxy
  address                 127.0.0.1:5140
  maxConns                100
  pcKeepAliveTimeout      60
  respBuffer              0
}
